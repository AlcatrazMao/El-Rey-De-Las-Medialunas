# ============================================================================
# Deploy Production — El Rey De Las Medialunas
# ============================================================================
name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@9 --activate
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm type-check

  deploy:
    name: Deploy All
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@9 --activate
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install

      - name: Setup & Deploy Backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          IMAGES_INTERNAL_TOKEN: ${{ secrets.IMAGES_INTERNAL_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          D1_ID=$(npx wrangler d1 list --json 2>&1 | grep -oP '"uuid":"\K[0-9a-f-]+(?=","name":"el-rey-db")' | head -1 || echo "")
          [ -z "$D1_ID" ] && D1_ID=$(npx wrangler d1 list --json 2>&1 | grep -oP '"name":"el-rey-db","uuid":"\K[0-9a-f-]+' | head -1 || echo "")
          [ -z "$D1_ID" ] && D1_ID=$(npx wrangler d1 list --json 2>&1 | grep -oP '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1 || echo "")
          echo "D1_ID=$D1_ID"

          KV_OUT=$(npx wrangler kv:namespace list 2>&1 || echo "")
          echo "KV_OUT=$KV_OUT"
          KV_IDS=($(echo "$KV_OUT" | grep -oP '[0-9a-f]{32}' || echo ""))
          KV0=${KV_IDS[0]:-}; KV1=${KV_IDS[1]:-}; KV2=${KV_IDS[2]:-}
          echo "KV IDs: $KV0 $KV1 $KV2"

          # Replace placeholders in ALL wrangler.toml files
          find workers -name wrangler.toml | while read f; do
            [ -n "$D1_ID" ] && sed -i "s/D1_ID_PLACEHOLDER/$D1_ID/g" "$f"
            [ -n "$KV0" ] && sed -i "s/KV_CACHE_PLACEHOLDER/$KV0/g" "$f"
            [ -n "$KV1" ] && sed -i "s/KV_SESSIONS_PLACEHOLDER/$KV1/g" "$f"
            [ -n "$KV2" ] && sed -i "s/KV_RATE_LIMIT_PLACEHOLDER/$KV2/g" "$f"
          done
          [ -n "$D1_ID" ] && sed -i "s/D1_ID_PLACEHOLDER/$D1_ID/g" wrangler.toml

          if [ -n "$D1_ID" ]; then
            npx wrangler d1 migrations apply el-rey-db --remote
          fi

          echo "=== Creating Queues (idempotent) ==="
          set +e
          (cd workers/api && npx wrangler queues create inventory-processing) 2>&1
          (cd workers/api && npx wrangler queues create report-generation) 2>&1
          set -e

          echo "=== Setting Worker Secrets (api) ==="
          echo "$IMAGES_INTERNAL_TOKEN" | (cd workers/api && npx wrangler secret put IMAGES_INTERNAL_TOKEN --env production)
          echo "$JWT_SECRET" | (cd workers/api && npx wrangler secret put JWT_SECRET --env production)
          echo "$FIREBASE_API_KEY" | (cd workers/api && npx wrangler secret put FIREBASE_API_KEY --env production)

          echo "=== Deploying Workers ==="
          for dir in workers/api workers/inventory-worker workers/reports-worker workers/sync-worker; do
            echo "--- $dir ---"
            (cd $dir && npx wrangler deploy --env production)
          done
          echo "--- workers/admin-users ---"
          # Delete non-production admin worker (ignore if doesn't exist)
          (cd workers/admin-users && npx wrangler delete admin-users 2>&1) || true
          echo "Deploying admin-users-production..."
          (cd workers/admin-users && npx wrangler deploy --env production)

          # Admin secrets set manually in Cloudflare Dashboard
          # (no se pushean desde CI para evitar corrupción)

      - name: Build Frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_APP_ENV: production
        run: pnpm build --filter=@medialunas/pos-pc

      - name: Create .firebaserc
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if echo "$FIREBASE_SA" | grep -q '^{'; then
            echo "$FIREBASE_SA" > /tmp/fb-key.json
          else
            echo "$FIREBASE_SA" | base64 -d > /tmp/fb-key.json
          fi
          FB_PROJECT=$(python3 -c "import json; print(json.load(open('/tmp/fb-key.json'))['project_id'])")
          echo "Firebase project: $FB_PROJECT"
          printf '{"projects":{"default":"%s"}}' "$FB_PROJECT" > .firebaserc

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
