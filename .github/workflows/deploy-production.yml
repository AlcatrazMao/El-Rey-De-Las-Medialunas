# ============================================================================
# Deploy Production — El Rey De Las Medialunas
# ============================================================================
name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

jobs:
  # ────────────────────────────────────────────────────────────────
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@9 --activate
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm build

  # ────────────────────────────────────────────────────────────────
  deploy-all:
    name: Deploy (D1 + Workers + Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable && corepack prepare pnpm@9 --activate
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pnpm install

      - name: Setup Cloudflare resources
        run: |
          npx wrangler d1 create el-rey-db 2>/dev/null || echo "D1 already exists"
          npx wrangler kv:namespace create "cache" 2>/dev/null || echo "KV cache already exists"
          npx wrangler kv:namespace create "sessions" 2>/dev/null || echo "KV sessions already exists"
          npx wrangler kv:namespace create "rate-limit" 2>/dev/null || echo "KV rate-limit already exists"
          npx wrangler queues create inventory-processing 2>/dev/null || echo "Queue already exists"
          npx wrangler queues create report-generation 2>/dev/null || echo "Queue already exists"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: D1 Migrations
        run: npx wrangler d1 migrations apply el-rey-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Build & Deploy Workers
        run: |
          cd workers/api && npx wrangler deploy && cd ../..
          cd workers/inventory-worker && npx wrangler deploy && cd ../..
          cd workers/reports-worker && npx wrangler deploy && cd ../..
          cd workers/sync-worker && npx wrangler deploy && cd ../..
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Build POS PC
        run: pnpm build --filter=@medialunas/pos-pc
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_API_URL: ${{ vars.PROD_API_URL || '' }}
          VITE_APP_ENV: production

      - name: Deploy POS PC to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live

      - name: Build POS Tablet
        run: pnpm build --filter=@medialunas/pos-tablet
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_API_URL: ${{ vars.PROD_API_URL || '' }}
          VITE_APP_ENV: production

      - name: Deploy POS Tablet to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
