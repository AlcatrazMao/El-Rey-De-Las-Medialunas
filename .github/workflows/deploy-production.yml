# ============================================================================
# Deploy Production — El Rey De Las Medialunas
# ============================================================================
name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@9 --activate
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm type-check

  deploy:
    name: Deploy All
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@9 --activate
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pnpm install

      - name: Setup & Deploy Backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          D1_ID=$(npx wrangler d1 list --json 2>&1 | grep -oP '"uuid":"\K[0-9a-f-]+(?=","name":"el-rey-db")' | head -1)
          [ -z "$D1_ID" ] && D1_ID=$(npx wrangler d1 list --json 2>&1 | grep -oP '"name":"el-rey-db","uuid":"\K[0-9a-f-]+' | head -1)
          echo "D1_ID=$D1_ID"

          KV_JSON=$(npx wrangler kv:namespace list --json 2>&1) || KV_JSON="[]"
          KV_IDS=($(echo "$KV_JSON" | grep -oP '[0-9a-f]{32}' || true))
          KV0=${KV_IDS[0]:-}; KV1=${KV_IDS[1]:-}; KV2=${KV_IDS[2]:-}

          [ -n "$D1_ID" ] && find workers -name wrangler.toml -exec sed -i "s/D1_ID_PLACEHOLDER/$D1_ID/g" {} \; && sed -i "s/D1_ID_PLACEHOLDER/$D1_ID/g" wrangler.toml
          [ -n "$KV0" ] && find workers -name wrangler.toml -exec sed -i "s/KV_CACHE_PLACEHOLDER/$KV0/g" {} \;
          [ -n "$KV1" ] && find workers -name wrangler.toml -exec sed -i "s/KV_SESSIONS_PLACEHOLDER/$KV1/g" {} \;
          [ -n "$KV2" ] && find workers -name wrangler.toml -exec sed -i "s/KV_RATE_LIMIT_PLACEHOLDER/$KV2/g" {} \;

          if [ -n "$D1_ID" ]; then
            npx wrangler d1 migrations apply el-rey-db --remote
          fi

          echo "=== Deploying Workers ==="
          for dir in workers/api workers/inventory-worker workers/reports-worker workers/sync-worker workers/admin-users; do
            echo "--- $dir ---"
            (cd $dir && npx wrangler deploy --env production)
          done

          echo "=== Setting Admin Worker Secrets ==="
          printf "%s" "${{ secrets.AUTH_SECRET }}" | (cd workers/admin-users && npx wrangler secret put AUTH_SECRET --env production)
          printf "%s" "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | (cd workers/admin-users && npx wrangler secret put FIREBASE_SERVICE_ACCOUNT --env production)
          printf "%s" "${{ secrets.FIREBASE_API_KEY }}" | (cd workers/admin-users && npx wrangler secret put FIREBASE_API_KEY --env production)

      - name: Build Frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_APP_ENV: production
        run: pnpm build --filter=@medialunas/pos-pc

      - name: Deploy to Firebase
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SA" > /tmp/fb-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/fb-key.json
          FB_PROJECT=$(python3 -c "import json; print(json.load(open('/tmp/fb-key.json'))['project_id'])")
          npx firebase-tools@latest deploy --only hosting --project "$FB_PROJECT"
