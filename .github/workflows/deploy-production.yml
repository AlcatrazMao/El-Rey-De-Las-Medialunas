# ============================================================================
# Deploy Production — El Rey De Las Medialunas
# ============================================================================
name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@9 --activate
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm type-check

  deploy:
    name: Deploy All
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@9 --activate
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pnpm install

      - name: Setup & Deploy Backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # ── Get D1 UUID ──
          D1_ID=$(npx wrangler d1 list --json 2>&1 | grep -oP '"uuid"\s*:\s*"\K[0-9a-f-]+' | head -1)
          echo "D1_ID=$D1_ID"

          # ── Get KV UUIDs ──
          KV_JSON=$(npx wrangler kv:namespace list --json 2>&1)
          echo "$KV_JSON"
          # Extract UUIDs — take first 3
          KV_IDS=($(echo "$KV_JSON" | grep -oP '[0-9a-f]{32}'))
          KV0=${KV_IDS[0]}
          KV1=${KV_IDS[1]}
          KV2=${KV_IDS[2]}
          echo "KV: $KV0 $KV1 $KV2"

          # ── Inject IDs into wrangler.toml files ──
          find workers -name wrangler.toml -exec sed -i "s/D1_ID_PLACEHOLDER/$D1_ID/g" {} \;
          find workers -name wrangler.toml -exec sed -i "s/KV_CACHE_PLACEHOLDER/$KV0/g" {} \;
          find workers -name wrangler.toml -exec sed -i "s/KV_SESSIONS_PLACEHOLDER/$KV1/g" {} \;
          find workers -name wrangler.toml -exec sed -i "s/KV_RATE_LIMIT_PLACEHOLDER/$KV2/g" {} \;
          # Also root wrangler.toml
          sed -i "s/D1_ID_PLACEHOLDER/$D1_ID/g" wrangler.toml

          # ── D1 Migrations ──
          npx wrangler d1 migrations apply el-rey-db --remote

          # ── Deploy Workers ──
          for dir in workers/api workers/inventory-worker workers/reports-worker workers/sync-worker; do
            echo "=== Deploying $dir ==="
            (cd $dir && npx wrangler deploy --env production)
          done

      - name: Build Frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_APP_ENV: production
        run: |
          pnpm build --filter=@medialunas/pos-pc
          pnpm build --filter=@medialunas/pos-tablet

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
