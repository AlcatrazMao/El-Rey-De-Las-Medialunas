# ============================================================================
# Deploy Production — El Rey De Las Medialunas
# ============================================================================
name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@9 --activate
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm type-check

  deploy:
    name: Deploy All
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@9 --activate
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pnpm install

      - name: Setup & Deploy Backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # ── Get D1 UUID (filter by name "el-rey-db") ──
          D1_JSON=$(npx wrangler d1 list --json 2>&1) || D1_JSON="[]"
          echo "$D1_JSON"
          D1_ID=$(echo "$D1_JSON" | grep -oP '"uuid":"\K[0-9a-f-]+(?=","name":"el-rey-db")' | head -1)
          # Fallback: try other field order
          [ -z "$D1_ID" ] && D1_ID=$(echo "$D1_JSON" | grep -oP '"name":"el-rey-db","uuid":"\K[0-9a-f-]+' | head -1)
          # Fallback: just take any UUID-like string after "el-rey-db"
          [ -z "$D1_ID" ] && D1_ID=$(echo "$D1_JSON" | grep -oP 'el-rey-db[^}]*[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | grep -oP '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          echo "D1_ID=$D1_ID"

          # ── Get KV UUIDs ──
          KV_JSON=$(npx wrangler kv:namespace list --json 2>&1) || KV_JSON="[]"
          echo "$KV_JSON"
          # Extract UUIDs — take first 3
          KV_IDS=($(echo "$KV_JSON" | grep -oP '[0-9a-f]{32}' || true))
          KV0=${KV_IDS[0]:-}
          KV1=${KV_IDS[1]:-}
          KV2=${KV_IDS[2]:-}
          echo "KV: $KV0 $KV1 $KV2"

          # ── Inject IDs into wrangler.toml files ──
          [ -n "$D1_ID" ] && find workers -name wrangler.toml -exec sed -i "s/D1_ID_PLACEHOLDER/$D1_ID/g" {} \; && sed -i "s/D1_ID_PLACEHOLDER/$D1_ID/g" wrangler.toml
          [ -n "$KV0" ] && find workers -name wrangler.toml -exec sed -i "s/KV_CACHE_PLACEHOLDER/$KV0/g" {} \;
          [ -n "$KV1" ] && find workers -name wrangler.toml -exec sed -i "s/KV_SESSIONS_PLACEHOLDER/$KV1/g" {} \;
          [ -n "$KV2" ] && find workers -name wrangler.toml -exec sed -i "s/KV_RATE_LIMIT_PLACEHOLDER/$KV2/g" {} \;

          # ── D1 Migrations ──
          if [ -n "$D1_ID" ]; then
            npx wrangler d1 migrations apply el-rey-db --remote
          else
            echo "WARNING: D1_ID not found, skipping migrations"
          fi

          # ── Set Admin Worker Secrets (before deploy so worker picks them up) ──
          echo "Setting admin worker secrets..."
          (cd workers/admin-users && echo "${{ secrets.AUTH_SECRET }}" | npx wrangler secret put AUTH_SECRET 2>&1) || true
          (cd workers/admin-users && echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | npx wrangler secret put FIREBASE_SERVICE_ACCOUNT 2>&1) || true
          (cd workers/admin-users && echo "${{ secrets.FIREBASE_API_KEY }}" | npx wrangler secret put FIREBASE_API_KEY 2>&1) || true

          # ── Deploy Workers ──
          for dir in workers/api workers/inventory-worker workers/reports-worker workers/sync-worker workers/admin-users; do
            echo "=== Deploying $dir ==="
            (cd $dir && npx wrangler deploy --env production)
          done

      - name: Build Frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_APP_ENV: production
        run: pnpm build --filter=@medialunas/pos-pc

      - name: Firebase Auth & Deploy
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SA" > /tmp/fb-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/fb-key.json
          FB_PROJECT=$(python3 -c "import json,sys; print(json.load(open('/tmp/fb-key.json'))['project_id'])")
          echo "Deploying to Firebase project: $FB_PROJECT"
          npx firebase-tools@latest deploy --only hosting --project "$FB_PROJECT"
