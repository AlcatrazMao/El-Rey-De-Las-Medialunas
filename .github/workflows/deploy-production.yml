# ============================================================================
# Deploy Production — El Rey De Las Medialunas
# ============================================================================
name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@9 --activate
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm type-check

  deploy:
    name: Deploy All
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@9 --activate
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pnpm install

      - name: Setup & Deploy Backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # ── D1 ──
          D1_OUT=$(npx wrangler d1 create el-rey-db --location=wnam 2>&1) || true
          echo "$D1_OUT"
          D1_ID=$(echo "$D1_OUT" | grep -oP '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          if [ -z "$D1_ID" ]; then
            D1_ID=$(npx wrangler d1 list --json 2>&1 | grep -oP '"uuid"\s*:\s*"\K[0-9a-f-]+' | head -1)
          fi
          export D1_ID
          echo "D1_ID=$D1_ID"

          # ── KV ──
          for ns in cache sessions rate-limit; do
            OUT=$(npx wrangler kv:namespace create "$ns" 2>&1) || true
            echo "$OUT"
            ID=$(echo "$OUT" | grep -oP 'id\s*=\s*"?\K[0-9a-f]{32}' | head -1)
            [ -z "$ID" ] && ID=$(echo "$OUT" | grep -oP '"id"\s*:\s*"\K[0-9a-f]{32}' | head -1)
            VAR="KV_$(echo $ns | tr '-' '_' | tr '[:lower:]' '[:upper:]')"
            export ${VAR}=$ID
            echo "${VAR}=$ID"
          done

          # ── Queues ──
          npx wrangler queues create inventory-processing --delivery-delay=0 2>&1 || true
          npx wrangler queues create report-generation --delivery-delay=0 2>&1 || true

          # ── D1 Migrations ──
          npx wrangler d1 migrations apply "$D1_ID" --remote

          # ── Deploy Workers ──
          for dir in workers/api workers/inventory-worker workers/reports-worker workers/sync-worker; do
            echo "=== Deploying $dir ==="
            (cd $dir && npx wrangler deploy)
          done

      - name: Build Frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_APP_ENV: production
        run: |
          pnpm build --filter=@medialunas/pos-pc
          pnpm build --filter=@medialunas/pos-tablet

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
