# ============================================================================
# Deploy Staging — El Rey De Las Medialunas
# Triggered on push to develop. Direct deployment, no environment gates.
# ============================================================================
name: Deploy Staging

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────
  # Quality Gate
  # ────────────────────────────────────────────────────────────────
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

  # ────────────────────────────────────────────────────────────────
  # D1 Migrations
  # ────────────────────────────────────────────────────────────────
  migrate-d1:
    name: D1 Migrations (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: d1 migrations apply el-rey-db --env staging

  # ────────────────────────────────────────────────────────────────
  # Deploy Cloudflare Workers
  # ────────────────────────────────────────────────────────────────
  deploy-workers:
    name: Deploy Workers (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality, migrate-d1]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build workers
        run: pnpm build --filter="./workers/*"

      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: workers/api
          command: deploy --env staging

      - name: Deploy Inventory Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: workers/inventory-worker
          command: deploy --env staging

      - name: Deploy Reports Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: workers/reports-worker
          command: deploy --env staging

      - name: Deploy Sync Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: workers/sync-worker
          command: deploy --env staging

  # ────────────────────────────────────────────────────────────────
  # Deploy Frontend to Firebase
  # ────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build POS PC
        run: pnpm build --filter=@medialunas/pos-pc
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_API_URL: ${{ vars.STAGING_API_URL || 'https://api-staging.elreydelasmedialunas.workers.dev' }}

      - name: Deploy POS PC to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: staging

      - name: Build POS Tablet
        run: pnpm build --filter=@medialunas/pos-tablet
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_API_URL: ${{ vars.STAGING_API_URL || 'https://api-staging.elreydelasmedialunas.workers.dev' }}

      - name: Deploy POS Tablet to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: staging-tablet
