# ============================================================================
# Wrangler Configuration — El Rey De Las Medialunas (Root)
# Cloudflare Workers + D1 + KV + Queues
# ============================================================================
name = "el-rey-de-las-medialunas"
main = "workers/api/src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# ---------------------------------------------------------------------------
# D1 Database
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "el-rey-db"
database_id = "D1_ID_PLACEHOLDER"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# Environment Variables
# ---------------------------------------------------------------------------
[vars]
APP_NAME = "El Rey De Las Medialunas"
APP_ENV = "development"

[env.staging.vars]
APP_ENV = "staging"

[env.production.vars]
APP_ENV = "production"
