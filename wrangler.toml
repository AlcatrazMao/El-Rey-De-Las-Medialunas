# ============================================================================
# Wrangler Configuration — El Rey De Las Medialunas (Root)
# Cloudflare Workers + D1 + KV + Queues
# ============================================================================
name = "el-rey-de-las-medialunas"
main = "workers/api/src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
account_id = "${CF_ACCOUNT_ID}"
workers_dev = true

# ---------------------------------------------------------------------------
# D1 Database
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "el-rey-db"
database_id = "${D1_DATABASE_ID}"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# KV Namespaces
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "CACHE"
id = "${KV_CACHE_ID}"

[[kv_namespaces]]
binding = "SESSIONS"
id = "${KV_SESSIONS_ID}"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "${KV_RATE_LIMIT_ID}"

# ---------------------------------------------------------------------------
# Queues
# ---------------------------------------------------------------------------
[[queues.producers]]
binding = "INVENTORY_QUEUE"
queue = "inventory-processing"

[[queues.producers]]
binding = "REPORTS_QUEUE"
queue = "report-generation"

[[queues.consumers]]
queue = "inventory-processing"
max_retries = 3
max_batch_size = 10

[[queues.consumers]]
queue = "report-generation"
max_retries = 2
max_batch_size = 5

# ---------------------------------------------------------------------------
# Environment Variables
# ---------------------------------------------------------------------------
[vars]
APP_NAME = "El Rey De Las Medialunas"
APP_ENV = "development"

[env.production.vars]
APP_ENV = "production"
