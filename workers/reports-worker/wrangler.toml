# ============================================================================
# Wrangler Configuration — Reports Worker
# El Rey De Las Medialunas
# ============================================================================
name = "el-rey-reports-worker"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# D1 Database Binding
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "el-rey-db"
database_id = "${D1_DATABASE_ID}"

# ---------------------------------------------------------------------------
# Queue Consumer
# ---------------------------------------------------------------------------
[[queues.consumers]]
queue = "report-generation"
max_retries = 2
max_batch_size = 5

# ---------------------------------------------------------------------------
# Environments
# ---------------------------------------------------------------------------
[env.staging.vars]
APP_ENV = "staging"

[env.production.vars]
APP_ENV = "production"
