# ============================================================================
# Wrangler Configuration — Reports Worker
# El Rey De Las Medialunas
# ============================================================================
name = "el-rey-reports-worker"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "el-rey-db"
database_id = "D1_ID_PLACEHOLDER"
database_id = "el-rey-db"

[[queues.consumers]]
queue = "report-generation"
max_retries = 2
max_batch_size = 5

[env.staging.vars]
APP_ENV = "staging"

[env.production.vars]
APP_ENV = "production"
