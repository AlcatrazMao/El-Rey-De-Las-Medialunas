# ============================================================================
# Wrangler Configuration — Inventory Worker
# El Rey De Las Medialunas
# ============================================================================
name = "el-rey-inventory-worker"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "el-rey-db"
database_id = "el-rey-db"

[[queues.consumers]]
queue = "inventory-processing"
max_retries = 3
max_batch_size = 10

[env.staging.vars]
APP_ENV = "staging"

[env.production.vars]
APP_ENV = "production"
