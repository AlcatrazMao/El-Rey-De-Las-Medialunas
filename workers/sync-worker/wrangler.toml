# ============================================================================
# Wrangler Configuration — Sync Worker
# El Rey De Las Medialunas
# ============================================================================
name = "el-rey-sync-worker"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# D1 Database Binding
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "el-rey-db"
database_id = "${D1_DATABASE_ID}"

# ---------------------------------------------------------------------------
# KV Namespace (sync state tracking)
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "SYNC_STATE"
id = "${KV_CACHE_ID}"

# ---------------------------------------------------------------------------
# Environments
# ---------------------------------------------------------------------------
[env.staging.vars]
APP_ENV = "staging"

[env.production.vars]
APP_ENV = "production"
