# ============================================================================
# Wrangler Configuration — Sync Worker
# El Rey De Las Medialunas
# ============================================================================
name = "el-rey-sync-worker"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "el-rey-db"
database_id = "${D1_ID}"

[[kv_namespaces]]
binding = "SYNC_STATE"
id = "${KV_CACHE}"

[env.staging.vars]
APP_ENV = "staging"

[env.production.vars]
APP_ENV = "production"
