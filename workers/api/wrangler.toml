# ============================================================================
# Wrangler Configuration — API Worker
# El Rey De Las Medialunas
# ============================================================================
name = "el-rey-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "el-rey-db"
database_id = "${D1_ID}"

[[kv_namespaces]]
binding = "CACHE"
id = "${KV_CACHE}"

[[kv_namespaces]]
binding = "SESSIONS"
id = "${KV_SESSIONS}"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "${KV_RATE_LIMIT}"

[[queues.producers]]
binding = "INVENTORY_QUEUE"
queue = "inventory-processing"

[[queues.producers]]
binding = "REPORTS_QUEUE"
queue = "report-generation"

[vars]
APP_NAME = "El Rey De Las Medialunas"

[env.production.vars]
APP_ENV = "production"
