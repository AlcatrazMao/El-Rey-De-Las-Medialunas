# ============================================================================
# Wrangler Configuration — API Worker
# El Rey De Las Medialunas
# ============================================================================
name = "el-rey-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "el-rey-db"
database_id = "D1_ID_PLACEHOLDER"

[[kv_namespaces]]
binding = "CACHE"
id = "KV_CACHE_PLACEHOLDER"

[[kv_namespaces]]
binding = "SESSIONS"
id = "KV_SESSIONS_PLACEHOLDER"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "KV_RATE_LIMIT_PLACEHOLDER"

[[queues.producers]]
binding = "INVENTORY_QUEUE"
queue = "inventory-processing"

[[queues.producers]]
binding = "REPORTS_QUEUE"
queue = "report-generation"

[vars]
APP_NAME = "El Rey De Las Medialunas"
APP_ENV = "development"
PRODUCT_IMAGES_URL = "BUCKET_R2_URL_PLACEHOLDER"

[env.staging.vars]
APP_ENV = "staging"

[env.production]
workers_dev = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "el-rey-db"
database_id = "D1_ID_PLACEHOLDER"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "KV_CACHE_PLACEHOLDER"

[[env.production.kv_namespaces]]
binding = "SESSIONS"
id = "KV_SESSIONS_PLACEHOLDER"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT"
id = "KV_RATE_LIMIT_PLACEHOLDER"

[[env.production.queues.producers]]
binding = "INVENTORY_QUEUE"
queue = "inventory-processing"

[[env.production.queues.producers]]
binding = "REPORTS_QUEUE"
queue = "report-generation"

[env.production.vars]
APP_NAME = "El Rey De Las Medialunas"
APP_ENV = "production"
PRODUCT_IMAGES_URL = "BUCKET_R2_URL_PLACEHOLDER"
