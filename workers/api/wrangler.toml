# ============================================================================
# Wrangler Configuration — API Worker
# El Rey De Las Medialunas
# ============================================================================
name = "el-rey-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# ---------------------------------------------------------------------------
# D1 Database Binding
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "el-rey-db"
database_id = "${D1_DATABASE_ID}"

# ---------------------------------------------------------------------------
# KV Namespaces
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "CACHE"
id = "${KV_CACHE_ID}"

[[kv_namespaces]]
binding = "SESSIONS"
id = "${KV_SESSIONS_ID}"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "${KV_RATE_LIMIT_ID}"

# ---------------------------------------------------------------------------
# Queue Producers (API pushes to queues)
# ---------------------------------------------------------------------------
[[queues.producers]]
binding = "INVENTORY_QUEUE"
queue = "inventory-processing"

[[queues.producers]]
binding = "REPORTS_QUEUE"
queue = "report-generation"

# ---------------------------------------------------------------------------
# Environment Variables
# ---------------------------------------------------------------------------
[vars]
APP_NAME = "El Rey De Las Medialunas"
APP_ENV = "development"

[env.staging.vars]
APP_ENV = "staging"

[env.production.vars]
APP_ENV = "production"
